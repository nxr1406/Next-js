<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Failure</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Roboto:wght@400;500&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0e0e0e',
                        bgCard: '#161616',
                        neonCyan: '#00ffcc',
                        neonPink: '#ff00ff',
                        neonRed: '#ff3333',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0e0e0e;
            color: #e0e0e0;
            overflow: hidden;
        }

        /* Glitch Effect for 404 */
        .glitch-404 {
            position: relative;
            animation: glitch-skew 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }
        .glitch-404::before, .glitch-404::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch-404::before {
            left: 2px;
            text-shadow: -2px 0 #ff00ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }
        .glitch-404::after {
            left: -2px;
            text-shadow: -2px 0 #00ffcc;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(32px, 9999px, 15px, 0); }
            20% { clip: rect(85px, 9999px, 98px, 0); }
            40% { clip: rect(12px, 9999px, 5px, 0); }
            60% { clip: rect(65px, 9999px, 12px, 0); }
            80% { clip: rect(9px, 9999px, 88px, 0); }
            100% { clip: rect(45px, 9999px, 66px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(12px, 9999px, 56px, 0); }
            20% { clip: rect(2px, 9999px, 44px, 0); }
            40% { clip: rect(55px, 9999px, 12px, 0); }
            60% { clip: rect(78px, 9999px, 98px, 0); }
            80% { clip: rect(12px, 9999px, 34px, 0); }
            100% { clip: rect(89px, 9999px, 15px, 0); }
        }
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            10% { transform: skew(-1deg); }
            20% { transform: skew(1deg); }
            30% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        /* CRT Scanline Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 50;
            pointer-events: none;
        }

        /* Terminal Cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #00ffcc;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-screen flex flex-col relative">

    <!-- CRT Overlay -->
    <div class="scanlines"></div>

    <!-- Navigation (Minimal) -->
    <nav class="absolute top-0 w-full z-40 p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="font-heading font-bold text-2xl tracking-wider text-white hover:text-neonCyan transition-colors">
                NXR<span class="text-neonCyan">.</span>
            </a>
        </div>
    </nav>

    <!-- Canvas Background -->
    <canvas id="error-canvas" class="absolute top-0 left-0 w-full h-full z-0 opacity-40"></canvas>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center relative z-10 px-4">
        <div class="text-center w-full max-w-3xl">
            
            <!-- Giant 404 -->
            <h1 class="text-[120px] md:text-[200px] leading-none font-heading font-bold text-transparent bg-clip-text bg-gradient-to-r from-neonPink to-neonCyan glitch-404 select-none mb-4" data-text="404">
                404
            </h1>

            <h2 class="text-2xl md:text-3xl text-white font-bold mb-8 tracking-widest uppercase">
                <span class="text-neonPink">System</span>_Failure: Signal Lost
            </h2>

            <!-- Terminal Window -->
            <div class="bg-gray-900/80 border border-gray-700 rounded-lg p-6 max-w-lg mx-auto text-left font-mono text-sm shadow-[0_0_20px_rgba(0,255,204,0.1)] backdrop-blur-sm mb-10 transform transition-transform hover:scale-[1.02]">
                <div class="flex space-x-2 mb-4 border-b border-gray-700 pb-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="ml-auto text-xs text-gray-500">bash -- restricted</span>
                </div>
                <div class="text-neonCyan" id="terminal-output">
                    <!-- Javascript will type here -->
                </div>
                <div class="mt-2">
                    <span class="text-neonPink">user@nxr:~$</span> <span class="cursor"></span>
                </div>
            </div>

            <!-- Action Button -->
            <a href="index.html" class="group relative inline-flex items-center justify-center px-8 py-3 overflow-hidden font-bold text-white rounded-full transition-all duration-300 hover:scale-105 focus:outline-none">
                <span class="absolute inset-0 w-full h-full bg-gradient-to-br from-neonCyan to-blue-600 group-hover:from-neonPink group-hover:to-purple-600 transition-all duration-300"></span>
                <span class="absolute bottom-0 right-0 block w-64 h-64 mb-32 mr-4 transition duration-500 origin-bottom-left transform rotate-45 translate-x-24 bg-white opacity-10 group-hover:rotate-90 ease"></span>
                <span class="relative flex items-center">
                    <i class="fas fa-undo mr-2"></i> Reboot System (Home)
                </span>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer class="absolute bottom-0 w-full py-4 text-center z-10 text-gray-600 text-xs font-mono">
        ERR_CODE: ID_10_T // CONTACT_ADMIN
    </footer>

    <!-- Scripts -->
    <script>
        // --- Terminal Typing Effect ---
        const terminalText = [
            "> Initiating search protocol...",
            "> Error: Target coordinates undefined.",
            "> Scanning sectors 0x00 to 0xFF...",
            "> Critical Failure: Page object not found.",
            "> Recommendation: Return to safe zone."
        ];
        
        const outputDiv = document.getElementById('terminal-output');
        let lineIndex = 0;
        let charIndex = 0;

        function typeLine() {
            if (lineIndex < terminalText.length) {
                if (charIndex < terminalText[lineIndex].length) {
                    outputDiv.innerHTML += terminalText[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeLine, Math.random() * 30 + 20);
                } else {
                    outputDiv.innerHTML += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeLine, 300);
                }
            }
        }

        setTimeout(typeLine, 500);

        // --- Chaotic Particle System (Red/Alert Theme) ---
        const canvas = document.getElementById('error-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2; // Faster than main site
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 3;
                // Colors: Cyan, Pink, and Red for error
                const colors = ['#00ffcc', '#ff00ff', '#ff3333']; 
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
                
                // Draw connections
                particles.forEach(p2 => {
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = p.color; // Error red tint
                        ctx.globalAlpha = (100 - dist) / 1000;
                        ctx.lineWidth = 1;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                });
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
